services:
  - type: web
    name: across-ai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m backend.ingest
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_FALLBACK_MODELS
        value: qwen/qwen3.8-27b,llama-3.1-8b-instant
      - key: CHROMA_PERSIST_DIR
        value: ./mgi_chroma_db
      - key: CHROMA_COLLECTION
        value: mgi_policy_handbook
